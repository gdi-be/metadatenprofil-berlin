<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="utf-8">
    <title>Profil des Metadateneditors der GDI Berlin - Version 1.0</title>
    <!-- Grid.js Themes & Stylesheets -->
    <link href="https://unpkg.com/gridjs/dist/theme/mermaid.min.css" rel="stylesheet" />
    <style>
        body { font-family: sans-serif; padding: 20px; background: #f9f9f9; }
        .container { max-width: 1200px; margin: 0 auto; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        h1 { color: #333; }
        /* Sorgt dafür, dass LF-Zeilenumbrüche im Browser als echte Umbrüche gerendert werden */
        .gridjs-td { white-space: pre-line !important; vertical-align: top !important; }
    </style>
</head>
<body>

<div class="container">
    <h1>Metadatenfelder des Metadateneditors</h1>
    <div id="wrapper"></div>
</div>

<!-- Grid.js Bibliothek laden -->
<script src="https://cdn.jsdelivr.net/npm/gridjs/dist/gridjs.umd.js"></script>
<script>
    // HIER DEN NAMEN IHRER TSV-DATEI EINTRAGEN:
    const tsvDatei = "doc_exports/tables/mde_metadatenprofil-berlin_git0.2.tsv"; 

    fetch(tsvDatei)
        .then(response => response.text())
        .then(text => {
            // Trennung der Tabellenzeilen strikt nach CRLF (\r\n)
            const rows = text.split(/\r\n/).filter(row => row.trim() !== "");
            if (rows.length === 0) return;

            // Header (erste Zeile) extrahieren
            const headers = rows[0].split("\t");

            // Daten extrahieren und verarbeiten
            const data = rows.slice(1).map(row => {
                return row.split("\t").map(cell => {
                    // Entfernt eventuelle überflüssige Leerzeichen, behält das LF aber bei
                    return cell.trim();
                });
            });

            // Tabelle initialisieren
            new gridjs.Grid({
                columns: headers,
                data: data,
                search: true, // Macht Ihre Tabelle durchsuchbar!
                sort: true,   // Macht Spalten sortierbar
                pagination: false,
                language: {
                    'search': { 'placeholder': 'Suchen...' },
                    'pagination': {
                        'previous': 'Zurück',
                        'next': 'Weiter',
                        'showing': 'Zeige',
                        'results': () => 'Einträge'
                    }
                }
            }).render(document.getElementById("wrapper"));
        })
        .catch(err => console.error("Fehler beim Laden der TSV-Datei:", err));
</script>

</body>
</html>
